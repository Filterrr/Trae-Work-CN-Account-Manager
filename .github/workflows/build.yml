name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'index.html'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# 发布 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundle_subdir: nsis
          - platform: macos
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            bundle_subdir: dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-${{ matrix.platform }}-

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅在 tag 推送时自动发布到 Release；其余情况只构建并上传 artifact
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'TRAE Work CN Manager ${{ github.ref_name }}'
          releaseBody: 'See assets below to download the installer for your platform.'
          releaseDraft: true
          prerelease: false
          args: '--target ${{ matrix.rust_target }}'

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/${{ matrix.bundle_subdir }}/*
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Build Summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report build status
        run: |
          {
            echo "### Build Summary"
            echo ""
            echo "Build matrix result: \`${{ needs.build.result }}\` (success = all platform legs passed)"
            echo ""
            echo "Platforms: \`windows-latest\`, \`macos-latest\`"
            echo ""
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "Release tag detected: \`${{ github.ref_name }}\`"
              echo "Draft release created — review & publish on the [Releases page](${{ github.server_url }}/${{ github.repository }}/releases)."
            else
              echo "Build artifacts uploaded to this workflow run (14-day retention)."
              echo "Re-run with a \`v*\` tag to publish a GitHub Release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
